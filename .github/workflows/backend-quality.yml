name: Backend quality checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'seed/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/backend-quality.yml'
  push:
    branches:
      - 'feature/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
